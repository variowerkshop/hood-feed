name: Hood-Datei aktualisieren

on:
  schedule:
    - cron: "23 * * * *"      # jede Stunde, zur Minute 23
  workflow_dispatch:             # zusaetzlich per Knopf "Run workflow"

permissions:
  contents: write

concurrency:
  group: hood-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hood-CSV erzeugen
        env:
          AUTOMATIK: "1"
          GS_TOKEN: ${{ secrets.GS_TOKEN }}
          KATEGORIE_HERREN: ${{ vars.KATEGORIE_HERREN }}
          KATEGORIE_DAMEN: ${{ vars.KATEGORIE_DAMEN }}
          KATEGORIE_JUNGEN: ${{ vars.KATEGORIE_JUNGEN }}
          KATEGORIE_MAEDCHEN: ${{ vars.KATEGORIE_MAEDCHEN }}
          MAX_MENGE: ${{ vars.MAX_MENGE }}
          MIN_GEWINN: ${{ vars.MIN_GEWINN }}
          DELTA: ${{ vars.DELTA }}
          DELTA_STUNDEN: ${{ vars.DELTA_STUNDEN }}
        run: python golden_zu_hood.py

      - name: Ergebnis speichern
        run: |
          git config user.name "hood-bot"
          git config user.email "hood-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Keine Aenderungen."
          else
            git commit -m "Hood-Datei aktualisiert"
            git push
          fi
