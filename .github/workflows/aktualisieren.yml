name: Hood-Datei aktualisieren

on:
  schedule:
    - cron: "23 * * * *"      # jede Stunde, zur Minute 23
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hood-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hood-CSV erzeugen
        env:
          CLP_URL: ${{ secrets.CLP_URL }}
          CLP_BESTAND_URL: ${{ secrets.CLP_BESTAND_URL }}
          CLP_KATEGORIEN: ${{ vars.CLP_KATEGORIEN }}
          RABATT: ${{ vars.RABATT }}
          AUFSCHLAG: ${{ vars.AUFSCHLAG }}
          MIN_GEWINN: ${{ vars.MIN_GEWINN }}
          MAX_MENGE: ${{ vars.MAX_MENGE }}
          MIN_BESTAND: ${{ vars.MIN_BESTAND }}
          SNEAKER_LOESCHEN: ${{ vars.SNEAKER_LOESCHEN }}
        run: python clp_zu_hood.py

      - name: Ergebnis speichern
        run: |
          git config user.name "hood-bot"
          git config user.email "hood-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Keine Aenderungen."
          else
            git commit -m "Hood-Datei aktualisiert"
            git push
          fi
